description: >-
  Bioscience (Tianjin) Diagnostic Technology Co., Ltd. (博奥赛斯) is a Chinese
  in-vitro diagnostics (IVD) company that integrates R&D, manufacturing,
  marketing, and technical support for diagnostic instruments and reagents. Its
  product lines span chemiluminescence immunoassay (CLIA) and point-of-care
  testing (POCT) analyzers together with the supporting reagent kits used in
  clinical laboratories and hospitals. The company is headquartered in Tianjin,
  China and is a healthcare portfolio company backed by Qiming Venture Partners.
  It manufactures medical diagnostic devices and consumables rather than
  publishing a public developer API; this profile is maintained in the API
  Evangelist network as a company lead, and no public API, developer portal,
  documentation, or specification surface has been found at this time.
